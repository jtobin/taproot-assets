\* Tear demonstration: the pre-certification design (act finality
\* from the on-chain flag plus a separately streamed best height,
\* removed in commit 7b240705) against the same in-contract chain.
\* BuggyNoFalseBurial is expected to be VIOLATED — the trace is the
\* historical torn-read bug — while the certification-based
\* NoFalseBurial holds in the same environment (MC_safety.cfg).
SPECIFICATION Spec
CONSTANTS
    Txs <- MCTxs
    Triggers <- MCTriggers
    SpendsOf <- MCSpendsOf
    PredOK <- MCPredOK
    Threshold = 2
    StabilityDepth = 1
    MaxLen = 4
    MaxBlocks = 6
    MaxPending = 2
    EnableEpochs = TRUE
    AlwaysConsume = FALSE
INVARIANTS
    BuggyNoFalseBurial
