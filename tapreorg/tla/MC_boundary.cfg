\* Boundary experiment: StabilityDepth = Threshold permits reorgs
\* deep enough to displace a certified location — the documented
\* out-of-scope case. CertifiedOnChain is expected to be VIOLATED;
\* the trace is the precise shape of the deep-reorg failure.
SPECIFICATION Spec
CONSTANTS
    Txs <- MCTxs
    Triggers <- MCTriggers
    SpendsOf <- MCSpendsOf
    PredOK <- MCPredOK
    Threshold = 2
    StabilityDepth = 2
    MaxLen = 4
    MaxBlocks = 6
    MaxPending = 2
    EnableEpochs = FALSE
    AlwaysConsume = FALSE
INVARIANTS
    CertifiedOnChain
