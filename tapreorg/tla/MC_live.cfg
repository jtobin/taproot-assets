\* Liveness (single anchoring): convergence of the
\* delivered phase and accuracy of the sensed view, under the
\* notifier liveness contract (per-stream SF) and retry discipline
\* (WF on Deliver). Expected to HOLD.
SPECIFICATION LiveSpec
CONSTANTS
    Txs <- MCTxs
    Triggers <- MCTriggers
    SpendsOf <- MCSpendsOf
    PredOK <- MCPredOK
    Threshold = 2
    StabilityDepth = 1
    MaxLen = 3
    MaxBlocks = 4
    MaxPending = 2
    EnableEpochs = FALSE
    AlwaysConsume = TRUE
INVARIANTS
    CertifiedOnChain
    NoFalseBurial
    NoFalseAbandon
PROPERTIES
    Convergence
    SensedTruth
