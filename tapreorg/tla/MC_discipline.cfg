\* Out-of-contract discipline run: deep reorgs
\* permitted (StabilityDepth = Threshold). The absorption and
\* monotonicity DISCIPLINE is expected to HOLD even though
\* chain-truth invariants (see MC_boundary.cfg) fail here.
SPECIFICATION Spec
CONSTANTS
    Txs <- MCTxs
    Triggers <- MCTriggers
    SpendsOf <- MCSpendsOf
    PredOK <- MCPredOK
    Threshold = 2
    StabilityDepth = 2
    MaxLen = 4
    MaxBlocks = 6
    MaxPending = 2
    EnableEpochs = FALSE
    AlwaysConsume = FALSE
PROPERTIES
    SensedTerminalAbsorbing
    DeliveredTerminalAbsorbing
    ViewMonotone
