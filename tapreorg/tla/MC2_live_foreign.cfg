\* Liveness (cascade, foreign instance): both sites
\* converge and every enqueued effect is eventually performed.
\* Expected to HOLD.
SPECIFICATION LiveSpec
CONSTANTS
    Txs <- MCTxsForeign
    ParentTriggers <- MCParentTriggers
    ChildTriggers <- MCChildTriggers
    SpendsOf <- MCSpendsOf
    PredOK <- MCPredOK
    AnchorOf <- MCAnchorOf
    DependedForm <- MCDependedForm
    Threshold = 2
    StabilityDepth = 1
    MaxLen = 3
    MaxBlocks = 4
    MaxPending = 2
    AlwaysConsume = TRUE
INVARIANTS
    CertifiedOnChain
    NoFalseBurial
    CertifiedFcOnChain
    NoFalseForeclosure
    MaterializeOnce
    GatedEffects
PROPERTIES
    CascadeConvergence
    EffectsDispatched
